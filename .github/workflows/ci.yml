name: Startseite CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PHP und Beispieldateien prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: PHP-Syntax prüfen
        run: |
          docker run --rm -v "$PWD:/app:ro" -w /app php:8.3-cli \
            sh -ec 'find . -name "*.php" -print0 | xargs -0 -n1 php -l'
      - name: Beispieldateien und ignorierte Konfiguration prüfen
        run: |
          test -f .env.example
          test ! -e .env
          test ! -e config/local.php
          grep -q 'Impressum' impressum_example.php
          grep -q 'Datenschutzerklärung' datenschutz_example.php

  deploy:
    name: Per FTPS bereitstellen und prüfen
    needs: validate
    if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request' && vars.STARTSEITE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: startseite-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Werkzeuge installieren
        run: sudo apt-get update && sudo apt-get install -y lftp php-cli
      - name: Dateien für den Webspace vorbereiten
        env:
          DB_HOST: ${{ vars.STARTSEITE_DB_HOST || 'localhost' }}
          DB_NAME: ${{ secrets.MARIADB_DATABASE }}
          DB_USER: ${{ secrets.MARIADB_USER }}
          DB_PASS: ${{ secrets.MARIADB_PASSWORD }}
          APP_PUBLIC_URL: ${{ vars.STARTSEITE_PUBLIC_URL }}
          LEGAL_IMPRESSUM_PHP: ${{ secrets.LEGAL_IMPRESSUM_PHP }}
          LEGAL_DATENSCHUTZ_PHP: ${{ secrets.LEGAL_DATENSCHUTZ_PHP }}
        run: |
          : "${DB_NAME:?Secret MARIADB_DATABASE fehlt}"
          : "${DB_USER:?Secret MARIADB_USER fehlt}"
          : "${DB_PASS:?Secret MARIADB_PASSWORD fehlt}"
          : "${LEGAL_IMPRESSUM_PHP:?Secret LEGAL_IMPRESSUM_PHP fehlt}"
          : "${LEGAL_DATENSCHUTZ_PHP:?Secret LEGAL_DATENSCHUTZ_PHP fehlt}"
          if [[ ! "$APP_PUBLIC_URL" =~ ^https://[^/[:space:]]+/?$ ]]; then
            echo 'STARTSEITE_PUBLIC_URL muss eine HTTPS-Adresse ohne Unterordner sein.' >&2
            exit 1
          fi

          release_dir="$RUNNER_TEMP/startseite-release"
          mkdir -p "$release_dir/assets/uploads/icons"
          git archive --output="$RUNNER_TEMP/startseite-release.tar" HEAD \
            index.php login.php config/auth.css config/bootstrap.php config/config.php \
            config/legal.css config/link_actions.php config/link_ui.php
          tar -xf "$RUNNER_TEMP/startseite-release.tar" -C "$release_dir"
          printf '%s' "$LEGAL_IMPRESSUM_PHP" > "$release_dir/impressum.php"
          printf '%s' "$LEGAL_DATENSCHUTZ_PHP" > "$release_dir/datenschutz.php"
          php -l "$release_dir/impressum.php"
          php -l "$release_dir/datenschutz.php"
          php -r '
              $names = ["DB_HOST", "DB_NAME", "DB_USER", "DB_PASS", "APP_PUBLIC_URL"];
              $config = array_combine($names, array_map("getenv", $names));
              if (file_put_contents($argv[1], "<?php\nreturn " . var_export($config, true) . ";\n") === false) {
                  exit(1);
              }
          ' "$release_dir/config/local.php"
      - name: Dateien per FTPS hochladen
        env:
          DEPLOY_HOST: ${{ vars.STARTSEITE_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.STARTSEITE_DEPLOY_PORT || '21' }}
          DEPLOY_PATH: ${{ vars.STARTSEITE_DEPLOY_PATH || '/' }}
          DEPLOY_USER: ${{ secrets.STARTSEITE_DEPLOY_USER }}
          LFTP_PASSWORD: ${{ secrets.STARTSEITE_DEPLOY_PASSWORD }}
        run: |
          : "${DEPLOY_USER:?Secret STARTSEITE_DEPLOY_USER fehlt}"
          : "${LFTP_PASSWORD:?Secret STARTSEITE_DEPLOY_PASSWORD fehlt}"
          if [[ ! "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ||
                ! "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ||
                ! "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9._/-]*$ ||
                ! "$DEPLOY_USER" =~ ^[a-zA-Z0-9_.@+-]+$ ]]; then
            echo 'Bitte Host, Port, Webverzeichnis und FTPS-Benutzer prüfen.' >&2
            exit 1
          fi

          cd "$RUNNER_TEMP/startseite-release"
          lftp <<EOF
          set cmd:fail-exit yes
          set net:timeout 30
          set net:max-retries 2
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          open --env-password -u "$DEPLOY_USER" -p "$DEPLOY_PORT" "ftp://$DEPLOY_HOST"
          mirror --reverse --verbose --transfer-all . "${DEPLOY_PATH%/}/."
          bye
          EOF
      - name: Öffentliche Seiten prüfen
        env:
          APP_PUBLIC_URL: ${{ vars.STARTSEITE_PUBLIC_URL }}
        run: |
          base_url="${APP_PUBLIC_URL%/}"
          for page in login.php impressum.php datenschutz.php; do
            curl --fail --silent --show-error --max-time 20 --output /dev/null "$base_url/$page"
          done
