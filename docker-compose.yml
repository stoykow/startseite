services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Bitte .env einrichten}
      MARIADB_DATABASE: ${MARIADB_DATABASE:?Bitte .env einrichten}
      MARIADB_USER: ${MARIADB_USER:?Bitte .env einrichten}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Bitte .env einrichten}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: ${MARIADB_DATABASE}
      DB_USER: ${MARIADB_USER}
      DB_PASS: ${MARIADB_PASSWORD}
      APP_PUBLIC_URL: http://localhost:28860
    ports:
      - "127.0.0.1:28860:80"
    volumes:
      - ./index.php:/var/www/html/index.php:ro
      - ./login.php:/var/www/html/login.php:ro
      - ./config:/var/www/html/config:ro
      - ./impressum_example.php:/var/www/html/impressum.php:ro
      - ./datenschutz_example.php:/var/www/html/datenschutz.php:ro
      - uploads:/var/www/html/assets/uploads/icons

volumes:
  database:
  uploads:
